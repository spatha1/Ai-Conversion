trigger:
  branches:
    include:
      - main
      - master
      - dev

pr:
  branches:
    include:
      - main
      - master
      - dev

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'
  nodeVersion: '20'
  acrName: ''
  resourceGroup: ''
  containerAppName: ''
  containerAppEnvironment: ''
  imageName: 'ai-conversion'
  imageTag: '$(Build.BuildId)'
  dockerfilePath: 'Dockerfile'
  dockerContext: '.'

stages:
  - stage: Build
    displayName: Build and Push
    jobs:
      - job: BuildAndPush
        displayName: Build Docker image and push to ACR
        steps:
          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: UsePythonVersion@0
            displayName: Install Python
            inputs:
              versionSpec: '$(pythonVersion)'

          - task: AzureCLI@2
            displayName: Build and push Docker image to ACR
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                echo "Logging in to ACR: $(acrName)"
                az acr login --name "$(acrName)"
                IMAGE="$(acrName).azurecr.io/$(imageName):$(imageTag)"
                echo "Building image: $IMAGE"
                docker build -t "$IMAGE" -f "$(dockerfilePath)" "$(dockerContext)"
                echo "Pushing image"
                docker push "$IMAGE"

  - stage: Deploy
    displayName: Deploy to Azure Container Apps
    dependsOn: Build
    jobs:
      - job: DeployContainerApp
        displayName: Deploy image to Container App
        steps:
          - task: AzureCLI@2
            displayName: Deploy container app
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                IMAGE="$(acrName).azurecr.io/$(imageName):$(imageTag)"
                echo "Deploying Container App: $(containerAppName)"

                if az containerapp show --name "$(containerAppName)" --resource-group "$(resourceGroup)" >/dev/null 2>&1; then
                  az containerapp update \
                    --name "$(containerAppName)" \
                    --resource-group "$(resourceGroup)" \
                    --image "$IMAGE"
                else
                  if [ -z "$(containerAppEnvironment)" ]; then
                    echo "ERROR: containerAppEnvironment must be set to create a new Container App."
                    exit 1
                  fi
                  ACR_USERNAME=$(az acr credential show --name "$(acrName)" --query username -o tsv)
                  ACR_PASSWORD=$(az acr credential show --name "$(acrName)" --query passwords[0].value -o tsv)
                  az containerapp create \
                    --name "$(containerAppName)" \
                    --resource-group "$(resourceGroup)" \
                    --environment "$(containerAppEnvironment)" \
                    --image "$IMAGE" \
                    --ingress external \
                    --target-port 8000 \
                    --registry-server "$(acrName).azurecr.io" \
                    --registry-username "$ACR_USERNAME" \
                    --registry-password "$ACR_PASSWORD" \
                    --cpu 1 --memory 1.5Gi

                az containerapp revision list --name "$(containerAppName)" --resource-group "$(resourceGroup)" --query "[].{name:name,status:status,image:image}" -o table
